# GitHub Pages builds this repository with Jekyll, so the specification is
# readable as a site as well as in the repository.
#
# Nothing here is needed to make the documents work. GitHub Pages enables
# jekyll-relative-links by default and cannot disable it, so every relative
# link between documents resolves to its rendered page without any
# configuration. This file only sets the title and the theme, and keeps the
# agent guides out of the published site.

title: The Game Panel specification
description: RFCs, ADRs, spec pages and refs for The Game Panel, managed with ArchDoc.

theme: jekyll-theme-primer

# Instructions for coding agents, not specification. PROCESS.md is published,
# because it is the authority on how these documents work and a reader of the
# specification needs it.
exclude:
  - agents/
  - AGENTS.md
  - .githooks/
  - archdoc.json
  - LICENSE
