name: Release the specification

# Every push to main publishes the specification as JSON, so that anything
# rendering or indexing it elsewhere consumes a release asset instead of
# parsing Markdown out of the repository. The same export is sent to
# archdoc.dev, so the asset and the site are one snapshot rather than two
# exports of the same commit taken separately.
#
# Chained to the lint workflow rather than repeating its checks, so a release
# comes only from a commit whose specification passed. There is no way to
# trigger on success alone: workflow_run fires when that workflow concludes
# whatever its conclusion, so the job below is gated on the conclusion.
#
# It can also be run by hand, to publish a commit whose release is missing or
# wrong. Nothing has linted that commit on this path, so it lints for itself.
on:
  workflow_run:
    workflows: [archdoc lint]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Unlike the lint workflow, this one writes: it creates a release.
permissions:
  contents: write

# One at a time, and never cancelled. Two pushes landing together would race to
# create their tags, and cancelling the earlier one would lose the release for
# a commit that is already on main.
concurrency:
  group: release-the-specification
  cancel-in-progress: false

jobs:
  release:
    name: Publish the export
    runs-on: ubuntu-latest
    # Nothing is published from a specification that did not pass. A manual run
    # carries no workflow_run payload, so its conclusion is empty and it is
    # admitted here, then linted as a step of its own below.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      # A workflow_run job checks out the default branch, not the commit that
      # triggered it, so the commit is named explicitly. Without this, a later
      # push could have moved main and the export would come from a commit that
      # was never linted.
      #
      # Export reads the working tree rather than history, so a shallow
      # checkout would do. The full history is fetched anyway, so that this job
      # sees the repository exactly as the lint job does and nothing breaks if
      # the export ever derives anything from git.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Pinned, and raised together with the pin in archdoc-lint.yml. The two
      # must not drift: the version decides the shape of what is generated,
      # and a mismatch is invisible locally. The export step below deliberately
      # names no version, so it uses the binary this step installs rather than
      # laying a second one over it.
      - uses: archdochq/setup@v1.0.0
        with:
          version: v0.5.0

      # Only on a manual run. The chained path is already gated on the lint
      # workflow having passed for this commit, and repeating it there would
      # put the checks in two places to drift apart.
      - name: Lint
        if: github.event_name == 'workflow_dispatch'
        run: |
          archdoc lint
          archdoc index --check
          archdoc glossary --check

      - name: Name the release
        id: name
        run: |
          set -euo pipefail
          # The commit's own date, not the day this runs, so re-running the job
          # produces the same tag rather than a second release under a later
          # date. Date first, so tags sort chronologically as plain strings.
          #
          # Read from the checkout rather than from the event, so the tag names
          # the commit that is actually being exported.
          tag="$(git show -s --format=%cs HEAD)-$(git rev-parse --short HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The asset is named the same in every release, so that
          # releases/latest/download/spec.json is a stable address for whatever
          # the specification currently is. That endpoint resolves by asset
          # name, so a name carrying the tag would have no such address. The
          # tag is what tells one release from another.
          echo "asset=spec.json" >> "$GITHUB_OUTPUT"

      # Export and publish in one step, so the asset attached to the release
      # and the snapshot archdoc.dev serves come from the same export and
      # cannot describe different commits.
      #
      # The commit is named rather than left to default: the action defaults it
      # to github.sha, which under workflow_run is the default branch's head,
      # not the commit this job checked out.
      #
      # The token is a repository secret, so any branch this workflow runs on
      # can publish and the endpoint does not restrict one itself. The triggers
      # are main and manual dispatch, which is what limits it.
      - name: Export the specification
        id: export
        uses: archdochq/export@v1.0.0
        with:
          file: ${{ steps.name.outputs.asset }}
          commit: ${{ github.event.workflow_run.head_sha || github.sha }}
          publish-token: ${{ secrets.ARCHDOCDEV_TOKEN }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          ASSET: ${{ steps.name.outputs.asset }}
          DOCUMENTS: ${{ steps.export.outputs.documents }}
        run: |
          set -euo pipefail
          # Read from git rather than from the event payload. A commit message
          # is untrusted input, and interpolating one into a script is the
          # standard workflow injection. GITHUB_SHA is wrong here for a second
          # reason: under workflow_run it names the default branch's head, not
          # the commit this job checked out.
          subject="$(git show -s --format=%s HEAD)"
          sha="$(git rev-parse HEAD)"

          notes="$(printf '%s\n\n%s\n' \
            "$subject" \
            "Exported from $sha. $DOCUMENTS documents, with the glossary, as the one JSON document archdoc export emits.")"

          # A re-run of a commit that already has its release replaces the
          # asset. Creating the tag again would fail, and failing a job that has
          # nothing left to do is noise.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "$TAG" --notes "$notes"
          fi
